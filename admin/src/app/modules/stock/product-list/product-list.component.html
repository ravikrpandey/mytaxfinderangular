<div class="pl-page">
  <section class="pl-card">
    <div class="pl-card-header">
      <h2 class="pl-card-title">PRODUCTS</h2>
      <button type="button" class="pl-collapse-btn" aria-label="Collapse products list">
        <span></span>
      </button>
    </div>

    <div class="pl-toolbar">
      <div class="pl-toolbar-actions-left">
        <button type="button" class="btn btn-add" (click)="goToCreate()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round" style="margin-right:6px">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          ADD NEW
        </button>
        <button type="button" class="btn btn-edit" [disabled]="!selectedProduct" (click)="goToEditSelected()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0f5e9c" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" style="margin-right:6px">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
            <path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
          </svg>
          EDIT
        </button>
        <button type="button" class="btn btn-refresh" (click)="refreshList()">REFRESH</button>
        <button type="button" class="btn btn-save" style="border-color: #d0d5db;" (click)="saveLayout()">
          SAVE LAYOUT
        </button>
        <button type="button" class="btn btn-export" (click)="exportToCSV()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8b5cf6" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" style="margin-right:6px">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          EXPORT
        </button>
        <button type="button" class="btn btn-import" style="border-color: #d0d5db;" (click)="triggerImport()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
          IMPORT
        </button>
        <input type="file" #fileInput style="display: none;" (change)="onFileSelected($event)" accept=".xlsx,.xls,.csv" />
      </div>
      <div class="pl-toolbar-actions-right">
        <button type="button" class="btn btn-delete" [disabled]="!selectedProduct" (click)="deleteSelected()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" style="margin-right:6px">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            <line x1="10" y1="11" x2="10" y2="17"></line>
            <line x1="14" y1="11" x2="14" y2="17"></line>
          </svg>
          DELETE
        </button>
        <button type="button" class="btn btn-refresh" style="border-color: #d0d5db;" (click)="resetLayout()">
          RESET LAYOUT
        </button>
      </div>
    </div>

    <form [formGroup]="filterForm" (ngSubmit)="applyFilter()" class="pl-filters">
      <div class="pl-search-row">
        <input type="text" formControlName="search" placeholder="Search products by code, name, category..."
          class="pl-search-input" />
        <button type="submit" class="btn btn-find">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round" style="margin-right:5px">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          Find
        </button>
        <button type="button" class="btn btn-clear" (click)="clearFilters()">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" style="margin-right:5px">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
          Clear
        </button>
      </div>
    </form>

    @if (error()) {
    <p class="error-message">{{ error() }}</p>
    }

    @if (loading()) {
    <div class="center">
      <span class="spinner large"></span>
      <p>Loading...</p>
    </div>
    } @else {
    <div class="pl-grid-shell">
      <ag-grid-angular class="pl-ag-grid ag-theme-balham" [columnDefs]="columnDefs" [defaultColDef]="defaultColDef"
        [rowData]="gridRows" [rowSelection]="rowSelection" [rowHeight]="35" [headerHeight]="38"
        [overlayNoRowsTemplate]="overlayNoRowsTemplate" [suppressCellFocus]="true" [suppressColumnMoveAnimation]="false"
        (gridReady)="onGridReady($event)" (selectionChanged)="onSelectionChanged($event)"
        (rowDoubleClicked)="onRowDoubleClicked($event)">
      </ag-grid-angular>
    </div>

    <div class="pl-footer-bar">
      <div class="pager">
        <button type="button" class="pager-btn" disabled>&laquo;</button>
        <button type="button" class="pager-btn" disabled>&lsaquo;</button>
        <button type="button" class="pager-btn" disabled style="font-size:8px">&#9664;</button>
        <span class="pager-text">{{ selectedRecordText }}</span>
        <button type="button" class="pager-btn" disabled style="font-size:8px">&#9654;</button>
        <button type="button" class="pager-btn" disabled>&rsaquo;</button>
        <button type="button" class="pager-btn" disabled>&raquo;</button>
      </div>
    </div>
    }
  </section>
</div>
