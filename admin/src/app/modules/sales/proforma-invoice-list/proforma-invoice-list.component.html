<div class="pi-page">
  <section class="pi-card">
    <div class="pi-card-header">
      <h2 class="pi-card-title">PROFORMA INVOICE</h2>
      <button type="button" class="pi-collapse-btn" aria-label="Collapse list"><span></span></button>
    </div>

    <div class="pi-toolbar">
      <div class="pi-toolbar-actions-left">
        <button type="button" class="btn btn-add" (click)="goToCreate()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right:6px"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          ADD NEW
        </button>
        <button type="button" class="btn btn-edit" [disabled]="!selectedRow" (click)="goToEditSelected()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0f5e9c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:6px"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
          EDIT
        </button>
        <button type="button" class="btn btn-refresh" (click)="refreshList()">REFRESH</button>
        <button type="button" class="btn btn-preview" [disabled]="!selectedRow" (click)="goToPreviewSelected()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0099ad" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:6px"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          PREVIEW
        </button>
        <button type="button" class="btn btn-save" style="border-color:#d0d5db" (click)="saveLayout()">SAVE LAYOUT</button>
        <button type="button" class="btn btn-export" (click)="exportToCSV()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:6px"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          EXPORT
        </button>
      </div>
      <div class="pi-toolbar-actions-right">
        <button type="button" class="btn btn-delete" [disabled]="!selectedRow" (click)="deleteSelected()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:6px"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
          DELETE
        </button>
        <button type="button" class="btn btn-refresh" style="border-color:#d0d5db" (click)="resetLayout()">RESET LAYOUT</button>
      </div>
    </div>

    <form [formGroup]="filterForm" (ngSubmit)="applyFilter()" class="pi-filters">
      <div class="pi-filters-row">
        <div class="field-group">
          <label>DATE FROM:</label>
          <input type="date" formControlName="dateFrom" />
        </div>
        <div class="field-group">
          <label>TO:</label>
          <input type="date" formControlName="dateTo" />
        </div>
        <button type="submit" class="btn btn-primary">SEARCH</button>
      </div>
      <div class="pi-search-row">
        <input type="text" formControlName="search" placeholder="Search proforma invoices..." class="pi-search-input" />
        <button type="button" class="btn btn-find" (click)="applyFilter()">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right:6px"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          Find
        </button>
        <button type="button" class="btn btn-clear" (click)="clearFilters()">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:6px"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          Clear
        </button>
      </div>
    </form>

    @if (error()) {
      <p class="error-message">{{ error() }}</p>
    }

    @if (loading()) {
      <div class="center">
        <span class="spinner large"></span>
        <p>Loading...</p>
      </div>
    } @else {
      <div class="pi-grid-shell">
        <ag-grid-angular class="pi-ag-grid ag-theme-balham"
          [columnDefs]="columnDefs"
          [defaultColDef]="defaultColDef"
          [rowData]="gridRows"
          [rowSelection]="rowSelection"
          [rowHeight]="35"
          [headerHeight]="38"
          [overlayNoRowsTemplate]="overlayNoRowsTemplate"
          [suppressCellFocus]="true"
          [ensureDomOrder]="true"
          (gridReady)="onGridReady($event)"
          (selectionChanged)="onSelectionChanged($event)"
          (rowDoubleClicked)="onRowDoubleClicked($event)">
        </ag-grid-angular>
      </div>

      <div class="pi-total-bar">
        <div class="pi-total-label">TOTAL</div>
        <div class="pi-total-values">
          <span>{{ totalNetAmount.toFixed(2) }}</span>
          <span>{{ totalTaxAmount.toFixed(2) }}</span>
          <span>{{ totalAmount.toFixed(2) }}</span>
        </div>
      </div>

      <div class="pi-footer-bar">
        <div class="pager">
          <button type="button" class="pager-btn" disabled>&laquo;</button>
          <button type="button" class="pager-btn" disabled>&lsaquo;</button>
          <button type="button" class="pager-btn" disabled style="font-size:8px">&#9664;</button>
          <span class="pager-text">{{ selectedRecordText }}</span>
          <button type="button" class="pager-btn" disabled style="font-size:8px">&#9654;</button>
          <button type="button" class="pager-btn" disabled>&rsaquo;</button>
          <button type="button" class="pager-btn" disabled>&raquo;</button>
        </div>
      </div>
    }
  </section>
</div>
