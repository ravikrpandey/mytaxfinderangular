<div class="sil-page">
  <section class="sil-card">
    <div class="sil-card-header">
      <h2 class="sil-card-title">SALES INVOICE</h2>
      <button type="button" class="sil-collapse-btn" aria-label="Collapse list"><span></span></button>
    </div>

    <div class="sil-toolbar">
      <div class="sil-toolbar-actions-left">
        <button type="button" class="btn btn-add" (click)="onCreateInvoice()">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:4px; vertical-align:middle;">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          ADD NEW
        </button>
        <button type="button" class="btn btn-edit" [disabled]="!selectedRow()" (click)="onEditSelected()">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:4px; vertical-align:middle;">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
            <path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
          </svg>
          EDIT
        </button>
        <button type="button" class="btn btn-save" style="border-color:#d0d5db" (click)="onSaveLayout()">SAVE LAYOUT</button>
        <button type="button" class="btn btn-refresh" (click)="refreshList()">REFRESH</button>
        <button type="button" class="btn btn-preview" [disabled]="!selectedRow()" (click)="onPreviewSelected()">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:4px; vertical-align:middle;">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          PREVIEW
        </button>
        <button type="button" class="btn btn-export" (click)="onExportCsv()">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:4px; vertical-align:middle;">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          EXPORT
        </button>
      </div>
      <div class="sil-toolbar-actions-right">
        <button type="button" class="btn btn-delete" [disabled]="!selectedRow()" (click)="deleteSelected()">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:4px; vertical-align:middle;">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
          DELETE
        </button>
        <button type="button" class="btn btn-refresh" style="border-color:#d0d5db" (click)="onResetLayout()">RESET LAYOUT</button>
      </div>
    </div>

    <!-- DATE FILTERS & SEARCH ROW -->
    <div class="sil-filters" [formGroup]="filterForm">
      <div class="sil-filters-row">
        <div class="field-group">
          <span>DATE FROM:</span>
          <input type="date" formControlName="dateFrom" />
        </div>
        <div class="field-group">
          <span>TO:</span>
          <input type="date" formControlName="dateTo" />
        </div>
        <button type="button" class="btn btn-primary" (click)="applyFilter()">SEARCH</button>
      </div>

      <div class="sil-search-row">
        <input type="text" class="sil-search-input" placeholder="Enter text to search..." formControlName="search" (keyup.enter)="applyFilter()" />
        <button type="button" class="btn btn-find" (click)="applyFilter()">Find</button>
        <button type="button" class="btn btn-clear" (click)="clearFilters()">Clear</button>
      </div>
    </div>

    <!-- GRID SHELL -->
    @if (error()) {
      <p class="error-message">{{ error() }}</p>
    }

    <div class="sil-grid-shell">
      @if (loading()) {
        <div class="center">
          <span class="spinner large"></span>
          <p>Loading...</p>
        </div>
      } @else {
        <ag-grid-angular
          class="sil-ag-grid ag-theme-balham"
          [rowData]="gridRows()"
          [columnDefs]="columnDefs"
          [defaultColDef]="defaultColDef"
          [rowSelection]="rowSelection"
          [overlayNoRowsTemplate]="overlayNoRowsTemplate"
          (gridReady)="onGridReady($event)"
          (selectionChanged)="onSelectionChanged($event)"
          (rowDoubleClicked)="onRowDoubleClicked($event)"
        ></ag-grid-angular>

        <div class="sil-total-bar">
          <div class="sil-total-label">Totals</div>
          <div class="sil-total-values">
            <span>{{ totalAmount.toFixed(2) }}</span>
          </div>
        </div>

        <div class="sil-footer-bar">
          <div class="pager">
            <button type="button" class="pager-btn" disabled>&laquo;</button>
            <button type="button" class="pager-btn" disabled>&lsaquo;</button>
            <button type="button" class="pager-btn" disabled style="font-size:8px">&#9664;</button>
            <span class="pager-text">{{ selectedRecordText() }}</span>
            <button type="button" class="pager-btn" disabled style="font-size:8px">&#9654;</button>
            <button type="button" class="pager-btn" disabled>&rsaquo;</button>
            <button type="button" class="pager-btn" disabled>&raquo;</button>
          </div>
        </div>
      }
    </div>
  </section>
</div>
