server {
    listen 80;
    server_name mytaxfinder.com www.mytaxfinder.com;

    # ─── PORTAL (Angular 17) — handles its OWN /admin route internally ─────────
    root /var/www/mytaxfinder/portal;
    index index.html;

    # Portal catch-all (Angular router handles /admin, /home, etc. internally)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── NEW ADMIN APP (Angular 20) at /adminpanel/ ────────────────────────────
    location /adminpanel/ {
        alias /var/www/mytaxfinder/adminpanel/;
        index index.html;
        try_files $uri $uri/ @adminpanel_fallback;
    }

    # Deep link fallback for /adminpanel/** routes (Angular SPA routing)
    location @adminpanel_fallback {
        internal;
        rewrite ^/adminpanel/.*$ /adminpanel/index.html break;
        root /var/www/mytaxfinder;
    }

    # ─── SECURITY & PERFORMANCE ────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 256;
}
