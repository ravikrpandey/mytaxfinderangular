server {
    listen 80;
    server_name YOUR_DOMAIN_OR_IP;   # <-- replace with your domain or LightSail IP

    # ─── PORTAL (Angular 17) served at / ───────────────────────────────────────
    root /var/www/mytaxfinder/portal;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── ADMIN (Angular 20) served at /admin/ ──────────────────────────────────
    location /admin/ {
        alias /var/www/mytaxfinder/admin/browser/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    # Rewrite fallback for admin deep links (e.g. /admin/dashboard)
    location ~* ^/admin/.*$ {
        alias /var/www/mytaxfinder/admin/browser/;
        try_files $uri $uri/ /admin/index.html;
    }

    # ─── SECURITY & PERFORMANCE HEADERS ────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 256;
}
